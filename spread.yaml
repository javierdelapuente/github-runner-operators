project: github-runner-operators
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04
environment:
  SUDO_USER: ubuntu
  LANG: C.UTF-8
  LANGUAGE: en
  CONCIERGE: '$(HOST: echo "${CONCIERGE:-concierge.yaml}")'
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
exclude:
- .git
- .tox
- .venv
- .*_cache
suites:
  charms/tests/integration/:
    summary: integration tests
    backends:
    - integration-test
    environment:
      MODULE/test_combined: test_combined
      MODULE/test_planner: test_planner
      MODULE/test_webhook_gateway: test_webhook_gateway
      TOX_ENV: charms-integration
